<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผจญภัยหุบเขาการคูณ การหาร</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Google Font 'Mali' สำหรับฟอนต์ลายมือเด็กน่ารักๆ -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Mali', cursive;
            touch-action: none;
            overflow: hidden;
            background-color: #fef3c7;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        /* --- รูปแบบกระดาษสมุดกราฟ (Math Theme) --- */
        .bg-grid-pattern {
            background-color: #ffffff;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(59, 130, 246, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 130, 246, 0.15) 1px, transparent 1px);
        }

        /* --- แอนิเมชันปุ่มและ UI --- */
        .btn-bouncy {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-bouncy:hover {
            transform: scale(1.05) translateY(-2px);
        }
        .btn-bouncy:active {
            transform: scale(0.95) translateY(4px);
            box-shadow: 0 0px 0 transparent !important;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); rotate: -2deg; }
            50% { transform: translateX(10px); rotate: 2deg; }
            75% { transform: translateX(-10px); rotate: -2deg; }
            100% { transform: translateX(0); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ไม้บรรทัด Progress Bar */
        .ruler-marks {
            background-image: repeating-linear-gradient(to right, transparent, transparent 18%, rgba(0,0,0,0.3) 18%, rgba(0,0,0,0.3) 20%);
        }
    </style>
</head>
<body class="relative text-gray-800">

    <!-- Canvas สำหรับวาดฉากและตัวละคร -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (Heads Up Display) -->
    <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 flex flex-col md:flex-row justify-between items-start md:items-center pointer-events-none drop-shadow-md z-10">
        <!-- ข้อมูลผู้เล่น -->
        <div class="flex items-center space-x-4 bg-white/90 p-2 px-5 rounded-3xl border-4 border-blue-400 shadow-[0_4px_0_#60a5fa] transform transition-transform hover:scale-105 pointer-events-auto">
            <span id="hudAvatar" class="text-4xl bg-blue-100 rounded-full p-1">🤠</span>
            <div class="flex flex-col">
                <span id="hudName" class="font-bold text-blue-700 text-xl leading-tight">น้องจ้อย</span>
                <span id="hudHearts" class="text-red-500 text-xl tracking-widest drop-shadow-sm">❤️❤️❤️</span>
            </div>
        </div>

        <!-- คะแนนและไม้บรรทัดเส้นชัย -->
        <div class="flex flex-col items-end mt-2 md:mt-0 bg-white/90 p-3 px-5 rounded-3xl border-4 border-orange-400 shadow-[0_4px_0_#fb923c] pointer-events-auto">
            <span class="font-black text-2xl text-orange-500 tracking-wide">คะแนน: <span id="hudScore" class="text-3xl text-orange-600">0</span>/20</span>
            <!-- Progress Bar แบบไม้บรรทัด -->
            <div class="w-40 md:w-56 h-6 bg-yellow-200 rounded-md mt-2 border-2 border-yellow-500 relative overflow-hidden shadow-inner">
                <div id="progressBar" class="h-full bg-green-400 w-0 transition-all duration-300 ease-out relative z-0"></div>
                <!-- ขีดไม้บรรทัด -->
                <div class="absolute inset-0 ruler-marks z-10 pointer-events-none opacity-50"></div>
                <span class="absolute inset-0 flex items-center justify-end pr-2 text-[10px] font-black text-yellow-800 z-20 pointer-events-none">🚩 เส้นชัย</span>
            </div>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobileControls" class="hidden absolute bottom-6 left-0 w-full px-6 flex justify-between pointer-events-none z-10">
        <div class="flex space-x-4 pointer-events-auto">
            <button id="btnLeft" class="w-16 h-16 md:w-20 md:h-20 bg-white/80 border-b-4 border-gray-400 rounded-full flex justify-center items-center text-3xl md:text-4xl shadow-lg active:translate-y-1 active:border-b-0 select-none text-blue-500">◀</button>
            <button id="btnRight" class="w-16 h-16 md:w-20 md:h-20 bg-white/80 border-b-4 border-gray-400 rounded-full flex justify-center items-center text-3xl md:text-4xl shadow-lg active:translate-y-1 active:border-b-0 select-none text-blue-500">▶</button>
        </div>
        <div class="pointer-events-auto">
            <button id="btnJump" class="w-20 h-20 md:w-24 md:h-24 bg-white/80 border-b-4 border-gray-400 rounded-full flex justify-center items-center text-4xl md:text-5xl shadow-lg active:translate-y-1 active:border-b-0 select-none text-green-500 font-black">A</button>
        </div>
    </div>

    <!-- ==================== UI Modals ==================== -->

    <!-- 1. Start Screen -->
    <div id="startScreen" class="absolute inset-0 bg-grid-pattern bg-yellow-50 flex justify-center items-center z-50 overflow-hidden">
        <!-- Floating Math Symbols Decor -->
        <div class="absolute top-10 left-10 text-6xl text-blue-200 font-black rotate-12">✖️</div>
        <div class="absolute bottom-20 left-20 text-7xl text-pink-200 font-black -rotate-12">➗</div>
        <div class="absolute top-20 right-20 text-6xl text-green-200 font-black rotate-45">➕</div>
        <div class="absolute bottom-10 right-32 text-8xl text-yellow-300 font-black">➖</div>

        <div class="bg-white p-8 md:p-10 rounded-[2rem] shadow-2xl border-8 border-blue-400 max-w-md w-[90%] text-center relative z-10 btn-bouncy" style="transform: scale(1);">
            <div class="bg-blue-100 inline-block p-4 rounded-full mb-4 shadow-inner">
                <span class="text-6xl">🍄</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-blue-600 mb-6 drop-shadow-sm leading-tight">ผจญภัยหุบเขา<br><span class="text-orange-500">การคูณ การหาร</span></h1>
            
            <div class="mb-5 text-left bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-gray-300">
                <label class="block text-lg font-bold text-gray-600 mb-2">🏷️ ชื่อนักผจญภัย:</label>
                <input type="text" id="playerNameInput" placeholder="พิมพ์ชื่อของหนูที่นี่..." class="w-full px-4 py-3 border-4 border-blue-200 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-blue-500 bg-white shadow-inner transition-colors" maxlength="12">
            </div>

            <div class="mb-8">
                <label class="block text-lg font-bold text-gray-600 mb-3 text-left pl-2">🎩 เลือกตัวละคร:</label>
                <div class="flex justify-between space-x-2 text-4xl cursor-pointer" id="avatarSelection">
                    <div class="avatar-option w-full py-2 border-4 border-orange-500 rounded-2xl bg-orange-100 transition-transform hover:scale-110" data-avatar="🤠">🤠</div>
                    <div class="avatar-option w-full py-2 border-4 border-gray-200 rounded-2xl hover:bg-gray-100 transition-transform hover:scale-110" data-avatar="🦊">🦊</div>
                    <div class="avatar-option w-full py-2 border-4 border-gray-200 rounded-2xl hover:bg-gray-100 transition-transform hover:scale-110" data-avatar="🐶">🐶</div>
                    <div class="avatar-option w-full py-2 border-4 border-gray-200 rounded-2xl hover:bg-gray-100 transition-transform hover:scale-110" data-avatar="🦄">🦄</div>
                </div>
            </div>

            <button id="btnStartGame" class="w-full bg-gradient-to-b from-orange-400 to-orange-600 text-white font-black py-4 rounded-2xl text-2xl shadow-[0_8px_0_#c2410c] btn-bouncy animate-pulse-soft">
                เริ่มเล่นเลย! 🚀
            </button>
        </div>
    </div>

    <!-- 2. Question Modal (Chalkboard Style) -->
    <div id="questionModal" class="hidden absolute inset-0 bg-black/70 flex justify-center items-center z-40 backdrop-blur-sm">
        <!-- Chalkboard Frame -->
        <div id="questionBox" class="bg-emerald-800 p-8 md:p-10 rounded-xl shadow-2xl border-[12px] border-yellow-800 max-w-lg w-[95%] text-center transform transition-transform scale-95 relative">
            <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-yellow-800 text-white px-6 py-2 rounded-b-xl font-bold border-2 border-t-0 border-yellow-900 shadow-md">ตอบคำถาม</div>
            
            <div class="text-6xl mb-4 mt-2 filter drop-shadow-md">🍄</div>
            <!-- Chalk Text -->
            <h2 id="questionText" class="text-3xl md:text-4xl font-bold text-white mb-8 leading-relaxed" style="text-shadow: 1px 1px 2px rgba(255,255,255,0.4);">5 × 4 = ?</h2>
            
            <div id="choiceContainer" class="grid grid-cols-1 gap-4">
                <!-- ปุ่มตัวเลือกจะถูกสร้างด้วย JS ให้ดูเหมือนเขียนด้วยชอล์ก -->
            </div>
        </div>
    </div>

    <!-- 3. Feedback/Explanation Modal -->
    <div id="feedbackModal" class="hidden absolute inset-0 bg-black/60 flex justify-center items-center z-50 backdrop-blur-sm">
        <div id="feedbackBox" class="bg-white p-8 rounded-3xl shadow-2xl border-8 max-w-md w-[95%] text-center btn-bouncy" style="transform: scale(1);">
            <div id="feedbackEmoji" class="text-7xl mb-4 animate-bounce">✨</div>
            <h2 id="feedbackTitle" class="text-4xl font-black mb-4">สถานะ</h2>
            <!-- Notebook Paper Style for Explanation -->
            <div class="bg-yellow-50 p-5 rounded-2xl mb-6 relative overflow-hidden border-2 border-yellow-200">
                <div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(transparent, transparent 27px, #3b82f6 28px);"></div>
                <p id="feedbackExplanation" class="text-xl text-gray-800 leading-8 relative z-10 font-medium">คำอธิบาย...</p>
            </div>
            <button id="btnNextAfterFeedback" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl text-2xl shadow-[0_6px_0_#2563eb] btn-bouncy">
                ลุยต่อเลย! 🏃‍♂️
            </button>
        </div>
    </div>

    <!-- 4. Game Over Modal -->
    <div id="gameOverModal" class="hidden absolute inset-0 bg-red-900/90 flex justify-center items-center z-50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border-8 border-red-500 max-w-md w-[90%] text-center relative overflow-hidden">
            <div class="absolute -right-10 -top-10 text-9xl opacity-10">😭</div>
            <div class="text-8xl mb-4">😭</div>
            <h1 class="text-5xl font-black text-red-600 mb-4 drop-shadow-sm">ว้า... พลาดซะแล้ว</h1>
            <p class="text-xl text-gray-600 mb-8 font-bold">หัวใจหมดแล้ว ไม่เป็นไรนะ ลองใหม่ได้!</p>
            <button id="btnRestartGameOver" class="w-full bg-gradient-to-b from-red-400 to-red-600 text-white font-black py-4 rounded-2xl text-2xl shadow-[0_8px_0_#991b1b] btn-bouncy animate-pulse-soft">
                เริ่มเล่นใหม่ 🔄
            </button>
        </div>
    </div>

    <!-- 5. Victory Modal -->
    <div id="victoryModal" class="hidden absolute inset-0 bg-green-900/90 flex justify-center items-center z-50 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border-8 border-yellow-400 max-w-md w-[90%] text-center">
            <div class="text-8xl mb-4 animate-bounce">🏆🎉</div>
            <h1 class="text-5xl font-black text-green-500 mb-2 drop-shadow-sm">เก่งมากๆ!</h1>
            <p class="text-xl text-gray-600 mb-6 font-bold">ผ่านหุบเขาคณิตศาสตร์ได้แล้ว</p>
            
            <div class="bg-yellow-100 border-4 border-yellow-300 p-6 rounded-3xl mb-8 transform rotate-2">
                <p class="text-2xl font-bold text-yellow-800 mb-2">คะแนนรวมของหนู</p>
                <div class="text-6xl font-black text-orange-500 flex justify-center items-baseline space-x-2">
                    <span id="finalScore" class="text-7xl drop-shadow-md">0</span> 
                    <span class="text-4xl text-orange-400">/ 20</span>
                </div>
            </div>
            
            <button id="btnRestartVictory" class="w-full bg-gradient-to-b from-green-400 to-green-600 text-white font-black py-4 rounded-2xl text-2xl shadow-[0_8px_0_#166534] btn-bouncy animate-pulse-soft">
                เล่นอีกครั้ง 🌟
            </button>
        </div>
    </div>

    <!-- ==================== Game Logic (JavaScript) ==================== -->
    <script>
        // 1. ข้อมูลคำถาม 20 ข้อ
        const mathQuestions = [
            { q: "5 × 4 = ?", choices: ["15", "20", "25"], ansIndex: 1, exp: "5 บวกกัน 4 ครั้ง (5+5+5+5) เท่ากับ 20 จ้า" },
            { q: "12 ÷ 3 = ?", choices: ["3", "4", "6"], ansIndex: 1, exp: "ขนม 12 ชิ้น แบ่งให้เด็ก 3 คน ได้คนละ 4 ชิ้น (3 × 4 = 12)" },
            { q: "7 × 8 = ?", choices: ["54", "56", "64"], ansIndex: 1, exp: "ท่องแม่ 7 ดูสิ 7 แปด 56!" },
            { q: "ส้ม 24 ผล แบ่งใส่ตะกร้า 4 ใบ จะได้ใบละกี่ผล?", choices: ["5", "6", "8"], ansIndex: 1, exp: "24 ÷ 4 = 6 เพราะ 4 × 6 = 24 จ้า" },
            { q: "9 × 6 = ?", choices: ["52", "54", "56"], ansIndex: 1, exp: "สูตรคูณแม่ 9: 9 × 6 = 54" },
            { q: "45 ÷ 5 = ?", choices: ["8", "9", "10"], ansIndex: 1, exp: "5 คูณอะไรได้ 45? คำตอบคือ 5 × 9 = 45" },
            { q: "ดินสอแท่งละ 6 บาท ซื้อ 5 แท่ง จ่ายกี่บาท?", choices: ["30", "35", "40"], ansIndex: 0, exp: "6 × 5 = 30 บาทจ้า" },
            { q: "42 ÷ 7 = ?", choices: ["5", "6", "7"], ansIndex: 1, exp: "7 × 6 = 42 ดังนั้น 42 ÷ 7 จึงเท่ากับ 6" },
            { q: "11 × 4 = ?", choices: ["40", "44", "48"], ansIndex: 1, exp: "11 × 4 = 44 เลขแฝดจำง่ายมาก!" },
            { q: "เงิน 50 บาท แบ่งลูก 5 คน ได้คนละกี่บาท?", choices: ["8", "10", "12"], ansIndex: 1, exp: "50 ÷ 5 = 10 บาท (แบงก์สิบ 5 ใบ!)" },
            { q: "8 × 8 = ?", choices: ["60", "64", "72"], ansIndex: 1, exp: "8 × 8 = 64 ท่องให้ขึ้นใจเลย" },
            { q: "63 ÷ 9 = ?", choices: ["6", "7", "8"], ansIndex: 1, exp: "9 × 7 = 63 ดังนั้น 63 ÷ 9 = 7" },
            { q: "ไข่ไก่ 3 แผง แผงละ 10 ฟอง มีไข่กี่ฟอง?", choices: ["20", "30", "40"], ansIndex: 1, exp: "3 × 10 = 30 ฟอง" },
            { q: "36 ÷ 6 = ?", choices: ["5", "6", "7"], ansIndex: 1, exp: "6 × 6 = 36 ตัวเลขเหมือนกันเลย!" },
            { q: "12 × 5 = ?", choices: ["50", "60", "70"], ansIndex: 1, exp: "12 × 5 = 60 ท่องสูตรคูณแม่ 12" },
            { q: "นักเรียน 28 คน จัดกลุ่มละ 4 คน ได้กี่กลุ่ม?", choices: ["6", "7", "8"], ansIndex: 1, exp: "28 ÷ 4 = 7 กลุ่ม เพราะ 4 × 7 = 28" },
            { q: "0 × 15 = ?", choices: ["0", "1", "15"], ansIndex: 0, exp: "0 คูณอะไรก็ได้ 0 เสมอ!" },
            { q: "100 ÷ 10 = ?", choices: ["5", "10", "100"], ansIndex: 1, exp: "10 × 10 = 100 ดังนั้น 100 ÷ 10 = 10" },
            { q: "สมุดเล่มละ 9 บาท ซื้อ 3 เล่ม จ่ายกี่บาท?", choices: ["24", "27", "30"], ansIndex: 1, exp: "9 × 3 = 27 บาท" },
            { q: "81 ÷ 9 = ?", choices: ["8", "9", "10"], ansIndex: 1, exp: "9 × 9 = 81 จ้า!" }
        ];

        // 2. ตั้งค่า Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth, canvasHeight;

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
        if (isMobile) {
            document.getElementById('mobileControls').classList.remove('hidden');
        }

        // 3. Audio (Oscillator)
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                [523.25, 659.25, 1046.50].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.1));
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'fall') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'win') {
                osc.type = 'square';
                [523.25, 659.25, 783.99, 1046.50, 1567.98].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.15));
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);
                osc.start(now); osc.stop(now + 1.0);
            }
        }

        // 4. Game Variables
        let gameState = 'start';
        let cameraX = 0;
        let targetCameraX = 0;
        let particles = [];
        let mathDecor = []; // สัญลักษณ์คณิตศาสตร์ลอยในฉาก
        
        const GRAVITY = 0.55; // ปรับให้นุ่มขึ้นเล็กน้อย
        const TERMINAL_VELOCITY = 14;
        const JUMP_FORCE = -12.5;
        const MOVE_SPEED = 6.5;

        let player = {
            x: 100, y: 0, w: 45, h: 45,
            vx: 0, vy: 0,
            grounded: false,
            name: 'น้องจ้อย', avatar: '🤠',
            score: 0, hearts: 3,
            checkpointX: 100, checkpointY: 0,
            color: '#3b82f6',
            animSquish: 1.0, animStretch: 1.0 // แอนิเมชันยืดหดตอนกระโดด
        };

        const keys = { left: false, right: false, up: false };
        let platforms = [];
        let mushrooms = [];
        let finishLine = { x: 0, y: 0, w: 100, h: 200 };
        let activeQuestionIndex = -1;
        let activeMushroom = null;

        // ฟังก์ชันสร้างฉาก
        function generateLevel() {
            platforms = []; mushrooms = []; particles = []; mathDecor = [];
            
            // สร้างสัญลักษณ์คณิตศาสตร์ตกแต่งฉากหลัง
            const symbols = ['+', '-', '×', '÷', '='];
            for(let i=0; i<30; i++) {
                mathDecor.push({
                    x: Math.random() * 10000,
                    y: Math.random() * (canvasHeight - 200),
                    char: symbols[Math.floor(Math.random() * symbols.length)],
                    size: Math.random() * 30 + 20,
                    color: `hsla(${Math.random()*360}, 70%, 70%, 0.4)`,
                    speedY: (Math.random() - 0.5) * 1,
                    speedRot: (Math.random() - 0.5) * 0.02,
                    rot: Math.random() * Math.PI * 2
                });
            }
            
            // แพลตฟอร์มเริ่ม
            platforms.push({ x: 0, y: canvasHeight - 120, w: 800, h: 200, type: 'start' });
            let currentX = 800;
            const floorY = canvasHeight - 120;

            for (let i = 0; i < 20; i++) {
                let gap = Math.random() * 150 + 80;
                if (i % 3 === 0 && i !== 0) currentX += gap;

                let platW = Math.random() * 250 + 250;
                let platY = floorY;
                if (Math.random() > 0.6 && i > 0) platY = floorY - (Math.random() * 120 + 60);
                
                platforms.push({ x: currentX, y: platY, w: platW, h: 200 });

                mushrooms.push({
                    x: currentX + platW / 2 - 25,
                    y: platY - 60,
                    w: 50, h: 50,
                    qIndex: i, collected: false,
                    floatOffset: Math.random() * Math.PI,
                    glow: 0
                });
                currentX += platW;
            }
            platforms.push({ x: currentX + 100, y: floorY, w: 800, h: 200, type: 'end' });
            finishLine = { x: currentX + 400, y: floorY - 180, w: 60, h: 180 };
        }

        // 5. Input
        window.addEventListener('keydown', e => {
            if (gameState !== 'playing') return;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space')) {
                jump();
            }
        });
        window.addEventListener('keyup', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        const addTouch = (btnId, keyName) => {
            const btn = document.getElementById(btnId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameState==='playing') keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        };
        addTouch('btnLeft', 'left'); addTouch('btnRight', 'right');
        document.getElementById('btnJump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

        function jump() {
            if (gameState === 'playing' && player.grounded) {
                player.vy = JUMP_FORCE;
                player.grounded = false;
                player.animSquish = 0.7; // ยืดขึ้น
                player.animStretch = 1.3;
                playSound('jump');
                // สร้างฝุ่นตอนกระโดด
                createParticles(player.x + player.w/2, player.y + player.h, '#d1d5db', 10, true);
            }
        }

        // 6. UI Logic
        const avatarOptions = document.querySelectorAll('.avatar-option');
        avatarOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                avatarOptions.forEach(o => {
                    o.classList.remove('border-orange-500', 'bg-orange-100');
                    o.classList.add('border-gray-200');
                });
                opt.classList.remove('border-gray-200');
                opt.classList.add('border-orange-500', 'bg-orange-100');
                player.avatar = opt.dataset.avatar;
            });
        });

        document.getElementById('btnStartGame').addEventListener('click', () => {
            initAudio();
            player.name = document.getElementById('playerNameInput').value.trim() || 'น้องจ้อย';
            player.score = 0; player.hearts = 3;
            player.vx = 0; player.vy = 0;
            
            generateLevel();
            player.x = platforms[0].x + 100;
            player.y = platforms[0].y - player.h;
            player.checkpointX = player.x; player.checkpointY = player.y;

            updateHUD();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            gameState = 'playing';
            requestAnimationFrame(gameLoop);
        });

        function updateHUD() {
            document.getElementById('hudName').innerText = player.name;
            document.getElementById('hudAvatar').innerText = player.avatar;
            document.getElementById('hudHearts').innerText = '❤️'.repeat(player.hearts) + '🖤'.repeat(3 - player.hearts);
            document.getElementById('hudScore').innerText = player.score;
            
            let progress = (player.x / finishLine.x) * 100;
            progress = Math.max(0, Math.min(100, progress));
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function triggerQuestion(mushroom) {
            gameState = 'paused';
            keys.left = false; keys.right = false;
            activeMushroom = mushroom;
            activeQuestionIndex = mushroom.qIndex;
            const qData = mathQuestions[activeQuestionIndex];

            // เซ็ตคำถาม
            document.getElementById('questionText').innerText = qData.q;
            
            const choiceContainer = document.getElementById('choiceContainer');
            choiceContainer.innerHTML = '';
            
            qData.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                // สไตล์ปุ่มเหมือนเขียนชอล์กบนกระดานดำ
                btn.className = "bg-emerald-900 border-2 border-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl text-2xl transition-transform active:scale-95 shadow-md flex justify-center items-center gap-4";
                btn.style.fontFamily = "'Mali', cursive";
                btn.innerHTML = `<span class="text-yellow-300">👉</span> ${choice}`;
                btn.onclick = () => checkAnswer(index);
                choiceContainer.appendChild(btn);
            });

            const qModal = document.getElementById('questionModal');
            qModal.classList.remove('hidden');
            // Animate scale in
            const qBox = document.getElementById('questionBox');
            qBox.style.transform = 'scale(0.8)';
            setTimeout(() => qBox.style.transform = 'scale(1)', 10);
        }

        function checkAnswer(selectedIndex) {
            document.getElementById('questionModal').classList.add('hidden');
            const qData = mathQuestions[activeQuestionIndex];
            const isCorrect = (selectedIndex === qData.ansIndex);
            
            const fbBox = document.getElementById('feedbackBox');
            const fbTitle = document.getElementById('feedbackTitle');
            const fbExp = document.getElementById('feedbackExplanation');
            const btnNext = document.getElementById('btnNextAfterFeedback');
            const fbEmoji = document.getElementById('feedbackEmoji');

            if (isCorrect) {
                playSound('correct');
                player.score++;
                createParticles(player.x + player.w/2, player.y, '#f59e0b', 40);
                activeMushroom.collected = true;
                
                fbBox.className = "bg-white p-8 rounded-3xl shadow-2xl border-[8px] border-green-400 max-w-md w-[95%] text-center btn-bouncy";
                fbTitle.className = "text-4xl font-black mb-4 text-green-500 drop-shadow-sm";
                fbTitle.innerText = "ยอดเยี่ยมเลย! 🌟";
                fbEmoji.innerText = "🤩";
                btnNext.className = "w-full bg-gradient-to-b from-green-400 to-green-600 text-white font-black py-4 rounded-2xl text-2xl shadow-[0_8px_0_#166534] btn-bouncy";
            } else {
                playSound('wrong');
                document.getElementById('gameCanvas').classList.add('shake-animation');
                setTimeout(() => document.getElementById('gameCanvas').classList.remove('shake-animation'), 400);
                activeMushroom.collected = true;

                fbBox.className = "bg-white p-8 rounded-3xl shadow-2xl border-[8px] border-red-400 max-w-md w-[95%] text-center btn-bouncy";
                fbTitle.className = "text-4xl font-black mb-4 text-red-500 drop-shadow-sm";
                fbTitle.innerText = "เกือบถูกแล้ว! ✌️";
                fbEmoji.innerText = "😅";
                btnNext.className = "w-full bg-gradient-to-b from-red-400 to-red-600 text-white font-black py-4 rounded-2xl text-2xl shadow-[0_8px_0_#991b1b] btn-bouncy";
            }

            fbExp.innerText = qData.exp;
            updateHUD();
            
            const fModal = document.getElementById('feedbackModal');
            fModal.classList.remove('hidden');
            fbBox.style.transform = 'scale(0.8)';
            setTimeout(() => fbBox.style.transform = 'scale(1)', 10);
        }

        document.getElementById('btnNextAfterFeedback').addEventListener('click', () => {
            document.getElementById('feedbackModal').classList.add('hidden');
            player.checkpointX = player.x;
            player.checkpointY = platforms.find(p => p.x <= player.x && p.x + p.w >= player.x).y - player.h;
            gameState = 'playing';
        });

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        function victory() {
            gameState = 'victory';
            playSound('win');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('finalScore').innerText = player.score;
            document.getElementById('victoryModal').classList.remove('hidden');
            createParticles(finishLine.x + 30, finishLine.y + 90, '#10b981', 150);
        }

        document.getElementById('btnRestartGameOver').addEventListener('click', () => location.reload());
        document.getElementById('btnRestartVictory').addEventListener('click', () => location.reload());

        // 7. Physics
        function AABB(rect1, rect2) {
            return (rect1.x < rect2.x + rect2.w && rect1.x + rect1.w > rect2.x &&
                    rect1.y < rect2.y + rect2.h && rect1.y + rect1.h > rect2.y);
        }

        function updatePhysics() {
            // คืนค่าการยืดหดของตัวละครให้กลับเป็นปกติ (Smooth Juice effect)
            player.animSquish += (1.0 - player.animSquish) * 0.2;
            player.animStretch += (1.0 - player.animStretch) * 0.2;

            if (keys.left) player.vx = -MOVE_SPEED;
            else if (keys.right) player.vx = MOVE_SPEED;
            else player.vx = 0;

            // เอฟเฟกต์ฝุ่นตอนวิ่งพื้น
            if (player.grounded && Math.abs(player.vx) > 0 && Math.random() < 0.2) {
                createParticles(player.x + player.w/2, player.y + player.h, '#e5e7eb', 1, true);
            }

            player.x += player.vx;

            // ชนแนวนอน
            for (let plat of platforms) {
                if (AABB(player, plat)) {
                    if (player.vx > 0) player.x = plat.x - player.w;
                    else if (player.vx < 0) player.x = plat.x + plat.w;
                    player.vx = 0;
                }
            }

            if (player.x < 0) player.x = 0;

            // ชนแนวตั้ง
            player.vy += GRAVITY;
            if (player.vy > TERMINAL_VELOCITY) player.vy = TERMINAL_VELOCITY;
            player.y += player.vy;
            player.grounded = false;

            for (let plat of platforms) {
                if (AABB(player, plat)) {
                    if (player.vy > 0) {
                        if (!player.grounded) {
                            // สควอชตอนตกถึงพื้น
                            player.animSquish = 1.3;
                            player.animStretch = 0.7;
                            createParticles(player.x + player.w/2, plat.y, '#e5e7eb', 5, true);
                        }
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.grounded = true;
                    } else if (player.vy < 0) {
                        player.y = plat.y + plat.h;
                        player.vy = 0;
                    }
                }
            }

            // ตกหลุม
            if (player.y > canvasHeight) {
                player.hearts--;
                playSound('fall');
                updateHUD();
                if (player.hearts <= 0) gameOver();
                else {
                    player.x = player.checkpointX;
                    player.y = player.checkpointY - 50;
                    player.vx = 0; player.vy = 0;
                    createParticles(player.x + 20, player.y + 20, '#ffffff', 30);
                }
            }

            // ชนเห็ด
            for (let m of mushrooms) {
                if (!m.collected && AABB(player, m)) {
                    triggerQuestion(m);
                    break;
                }
            }

            // ชนเส้นชัย
            if (AABB(player, finishLine)) victory();

            // กล้อง (Lerp สมูทขึ้น)
            targetCameraX = player.x - canvasWidth * 0.4; // ให้อยู่ค่อนมาทางซ้ายนิดนึง
            cameraX += (targetCameraX - cameraX) * 0.08;
            if (cameraX < 0) cameraX = 0;
        }

        // ระบบอนุภาค (Dust / Confetti)
        function createParticles(x, y, color, count, isDust = false) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (isDust ? 3 : 10),
                    vy: isDust ? (Math.random() * -2) : ((Math.random() - 0.5) * 10 - 3),
                    life: 1.0,
                    color: color,
                    size: Math.random() * (isDust ? 6 : 8) + 3,
                    isDust: isDust
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (!p.isDust) p.vy += 0.2; // Gravity สำหรับพลุ
                else p.size *= 0.95; // ฝุ่นค่อยๆ เล็กลง
                
                p.life -= p.isDust ? 0.05 : 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            // อัปเดตสัญลักษณ์ตกแต่งฉาก
            mathDecor.forEach(d => {
                d.y += d.speedY;
                d.rot += d.speedRot;
                if(d.y > canvasHeight || d.y < -100) d.speedY *= -1;
            });
        }

        // 8. Rendering
        function drawParallaxBackground() {
            // พื้นหลังไล่สีสว่างๆ
            let grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            grad.addColorStop(0, "#BAE6FD"); // sky-200
            grad.addColorStop(1, "#FEF3C7"); // yellow-100
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // วาดพระอาทิตย์
            ctx.fillStyle = "#FDE047";
            ctx.beginPath(); ctx.arc(canvasWidth - 120, 120, 70, 0, Math.PI * 2); ctx.fill();

            // วาดสัญลักษณ์เลข (Parallax)
            ctx.save();
            mathDecor.forEach(d => {
                ctx.save();
                // ให้ลอยช้ากว่ากล้องมากๆ (Parallax)
                let renderX = d.x - (cameraX * 0.1); 
                // ทำให้ลูป (Looping background)
                renderX = ((renderX % 2000) + 2000) % 2000; 
                if (renderX < canvasWidth) {
                    ctx.translate(renderX, d.y);
                    ctx.rotate(d.rot);
                    ctx.fillStyle = d.color;
                    ctx.font = `bold ${d.size}px 'Mali'`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(d.char, 0, 0);
                }
                ctx.restore();
            });
            ctx.restore();

            // ภูเขาหลัง
            ctx.fillStyle = "#A7F3D0";
            const bgOffset = (cameraX * 0.15) % 1000;
            for(let i = -1; i < canvasWidth/500 + 2; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 500 - bgOffset, canvasHeight);
                ctx.lineTo(i * 500 + 250 - bgOffset, canvasHeight - 350);
                ctx.lineTo(i * 500 + 500 - bgOffset, canvasHeight);
                ctx.fill();
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawParallaxBackground();

            ctx.save();
            ctx.translate(-cameraX, 0);

            // แพลตฟอร์ม (ธีมกระดาษกราฟขอบสี)
            platforms.forEach(plat => {
                // ตัวบล็อกสีขาว
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(plat.x, plat.y + 10, plat.w, plat.h - 10);
                
                // วาดลายตารางบนบล็อก
                ctx.strokeStyle = "rgba(59, 130, 246, 0.1)"; // เส้นตารางสีฟ้าอ่อน
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let i=0; i<plat.w; i+=30) { ctx.moveTo(plat.x+i, plat.y+10); ctx.lineTo(plat.x+i, plat.y+plat.h); }
                for(let i=10; i<plat.h; i+=30) { ctx.moveTo(plat.x, plat.y+i); ctx.lineTo(plat.x+plat.w, plat.y+i); }
                ctx.stroke();

                // ขอบบนหนาๆ น่ารักๆ (สีเขียว หรือส้ม)
                ctx.fillStyle = plat.type === 'start' ? '#3B82F6' : (plat.type === 'end' ? '#10B981' : '#F59E0B');
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, 20, [10, 10, 0, 0]); // มนข้างบน
                ctx.fill();

                // เส้นประน่ารักๆ ขอบบน
                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 10]);
                ctx.beginPath();
                ctx.moveTo(plat.x + 10, plat.y + 10);
                ctx.lineTo(plat.x + plat.w - 10, plat.y + 10);
                ctx.stroke();
                ctx.setLineDash([]); // reset
            });

            // ธงเส้นชัย (ทำเป็นดินสอขนาดยักษ์)
            ctx.fillStyle = "#FCD34D"; // ด้ามดินสอ
            ctx.fillRect(finishLine.x + 20, finishLine.y + 30, 20, finishLine.h - 30);
            ctx.fillStyle = "#FCA5A5"; // ยางลบ
            ctx.beginPath(); ctx.roundRect(finishLine.x + 18, finishLine.y + 10, 24, 20, 5); ctx.fill();
            ctx.fillStyle = "#D1D5DB"; // ปลอกเหล็ก
            ctx.fillRect(finishLine.x + 18, finishLine.y + 30, 24, 10);
            // ธงแดง
            ctx.fillStyle = "#EF4444";
            ctx.beginPath(); ctx.moveTo(finishLine.x + 40, finishLine.y + 50); ctx.lineTo(finishLine.x + 90, finishLine.y + 70); ctx.lineTo(finishLine.x + 40, finishLine.y + 90); ctx.fill();
            ctx.font = "black 24px Mali";
            ctx.fillStyle = "#1F2937";
            ctx.fillText("FINISH!", finishLine.x + 5, finishLine.y - 5);

            // เห็ด (ทำให้ดูเหมือนผลึกอัญมณีมีแสงกะพริบ)
            const time = Date.now() / 200;
            mushrooms.forEach(m => {
                if (!m.collected) {
                    const floatY = m.y + Math.sin(time + m.floatOffset) * 8;
                    
                    // ก้าน
                    ctx.fillStyle = "#FEF08A";
                    ctx.beginPath(); ctx.roundRect(m.x + 15, floatY + 20, 20, 30, 5); ctx.fill();
                    // หมวก (สีชมพูบานเย็น)
                    ctx.fillStyle = "#EC4899";
                    ctx.beginPath(); ctx.arc(m.x + 25, floatY + 20, 25, Math.PI, 0); ctx.fill();
                    
                    // ลายจุด
                    ctx.fillStyle = "white";
                    ctx.beginPath(); ctx.arc(m.x + 12, floatY + 8, 5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(m.x + 25, floatY + 2, 7, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(m.x + 38, floatY + 10, 4, 0, Math.PI*2); ctx.fill();

                    // ตัวหนังสือลอยๆ
                    ctx.font = "bold 26px 'Mali'";
                    ctx.fillStyle = "#FFFFFF";
                    ctx.shadowColor = "rgba(0,0,0,0.4)";
                    ctx.shadowBlur = 4;
                    ctx.fillText("?", m.x + 15, floatY - 5);
                    ctx.shadowBlur = 0;
                }
            });

            // ตัวละคร (พร้อม Squash & Stretch)
            ctx.save();
            // เลื่อนจุดอ้างอิงไปที่ฐานตัวละครสำหรับการสเกล
            ctx.translate(player.x + player.w/2, player.y + player.h);
            ctx.scale(player.animStretch, player.animSquish);
            
            // วาดตัว (อ้างอิงจากตรงกลางฐาน)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(-player.w/2, -player.h + 5, player.w, player.h - 5, 12);
            ctx.fill();
            
            // ตา
            ctx.fillStyle = "white";
            const lookDir = keys.left ? -3 : (keys.right ? 3 : 0);
            ctx.beginPath(); ctx.arc(-8 + lookDir, -player.h + 20, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8 + lookDir, -player.h + 20, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(-8 + lookDir*1.5, -player.h + 20, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8 + lookDir*1.5, -player.h + 20, 3, 0, Math.PI*2); ctx.fill();

            // แก้มแดง
            ctx.fillStyle = "rgba(239, 68, 68, 0.4)";
            ctx.beginPath(); ctx.arc(-14 + lookDir, -player.h + 26, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(14 + lookDir, -player.h + 26, 4, 0, Math.PI*2); ctx.fill();

            // Avatar หมวก (วาดให้อยู่บนหัว)
            ctx.font = "36px Arial";
            ctx.textAlign = 'center';
            ctx.fillText(player.avatar, 0, -player.h);

            ctx.restore();

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                if (p.isDust) {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); // ฝุ่นกลม
                } else {
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size); // พลุสี่เหลี่ยม
                }
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        // 9. Main Loop
        function gameLoop() {
            if (gameState === 'playing' || gameState === 'victory') {
                updatePhysics();
                updateParticles();
                updateHUD();
            }
            drawGame();

            if (gameState !== 'gameover' && gameState !== 'start') {
                requestAnimationFrame(gameLoop);
            } else if (gameState === 'gameover') {
                drawGame();
            }
        }

        // วาดฉากรอตอนเริ่ม
        generateLevel();
        drawGame();

    </script>
</body>
